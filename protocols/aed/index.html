<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ʔuʔəy̓ — Autonomic Exposure Desensitization</title>
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-title" content="ʔuʔəy̓">
    <link rel="stylesheet" href="../../style.css">
    <style>
        :root {
            --aed-bg: #050608;
            --aed-calm-blue: #4a8fb8;
            --aed-exit-border: rgba(74, 143, 184, 0.55);
            --emergency-footer-height: 80px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--aed-bg) !important;
            color: rgba(140, 156, 170, 0.38);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            -webkit-tap-highlight-color: transparent;
            display: block !important;
            justify-content: unset !important;
        }

        .aed-page {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: var(--aed-bg);
        }

        .aed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 11998;
            margin: 0;
            padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 12px)) 8px max(12px, env(safe-area-inset-left, 12px));
            background: var(--aed-bg);
            pointer-events: none;
        }

        .aed-header .protocol-header {
            position: static;
            left: auto;
            right: auto;
            z-index: auto;
        }

        .aed-exit {
            position: fixed;
            top: calc(env(safe-area-inset-top, 12px) + 12px);
            right: max(12px, env(safe-area-inset-right, 12px));
            z-index: 12000;
            border: 1.5px solid var(--aed-exit-border);
            background: rgba(10, 13, 18, 0.92);
            color: var(--aed-calm-blue);
            padding: 11px 14px;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-decoration: none;
            font-family: inherit;
            border-radius: 4px;
            touch-action: manipulation;
        }

        .aed-exit:focus-visible {
            outline: 2px solid var(--aed-calm-blue);
            outline-offset: 2px;
        }

        .aed-shell {
            flex: 1;
            position: relative;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: var(--aed-bg);
            transition: filter 0.4s linear;
        }

        #instruction-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0 max(1.5rem, env(safe-area-inset-left, 0px)) 0 max(1.5rem, env(safe-area-inset-right, 0px));
            background: transparent !important;
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            font-weight: 600;
            line-height: 1.35;
            letter-spacing: 0.03em;
            text-align: center;
            color: #ffffff;
            pointer-events: none;
            opacity: 1;
            transition: opacity 500ms ease;
        }

        #instruction-overlay.is-fading {
            opacity: 0;
        }

        #aed-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            display: block;
            z-index: 1;
            touch-action: none;
            cursor: default;
            background: var(--aed-bg);
        }
    </style>
</head>
<body>
    <div class="aed-page" id="aed-page">
        <header class="aed-header" aria-hidden="true">
            <p class="protocol-header">Help me focus</p>
        </header>

        <button type="button" class="aed-exit stop-back-btn" id="aed-stop-back" title="Stop and go back">STOP &amp; BACK</button>
        <button type="button" id="gameplay-audio-toggle" class="gameplay-audio-toggle gameplay-theta-toggle" aria-pressed="false" aria-label="Sound off. Tap to turn on." title="Toggle optional sound">
            <span class="gameplay-theta-toggle-prefix" aria-hidden="true">♪</span>
            <span class="gameplay-theta-toggle-label">Sound</span>
            <span class="gameplay-theta-toggle-state" aria-hidden="true">OFF</span>
        </button>

        <main class="aed-shell" id="aed-shell" aria-label="Attention focus canvas">
            <canvas id="aed-canvas" aria-hidden="true"></canvas>
        </main>

        <div id="instruction-overlay" role="status" aria-live="polite">Focus on the glowing ovals when you are ready.</div>

        <div id="checkin-overlay" class="checkin-overlay hidden" aria-hidden="true">
            <section class="checkin-card" role="dialog" aria-modal="true" aria-labelledby="checkin-title">
                <h2 id="checkin-title" class="checkin-title">Did that help?</h2>
                <p class="checkin-sub">No wrong answers. This stays with you — nothing is saved.</p>
                <div class="checkin-choices">
                    <button type="button" class="checkin-choice" data-checkin="better">Feeling a bit better</button>
                    <button type="button" class="checkin-choice" data-checkin="switch">Want to try something else</button>
                    <button type="button" class="checkin-choice" data-checkin="break">I need a break for now</button>
                </div>
            </section>
        </div>

        <footer class="emergency-exit-bar emergency-exit-bar--global" aria-label="Crisis support — always available">
            <p class="crisis-footer-text">Need support? Call or text 988 (Lifeline) or 911. This app cannot send emergency help.</p>
            <button type="button" class="emergency-exit-link" data-emergency-dial>Call or text 988 / 911</button>
        </footer>
    </div>

    <script src="../../safety-control.js"></script>
    <script src="script.js"></script>
    <script>
        (function () {
            var soundOn = false;
            var toggle = document.getElementById('gameplay-audio-toggle');
            if (toggle) {
                toggle.addEventListener('click', function () {
                    soundOn = !soundOn;
                    toggle.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
                    toggle.setAttribute('aria-label', soundOn ? 'Sound on. Tap to turn off.' : 'Sound off. Tap to turn on.');
                    var state = toggle.querySelector('.gameplay-theta-toggle-state');
                    if (state) state.textContent = soundOn ? 'ON' : 'OFF';
                    toggle.classList.toggle('gameplay-theta-toggle--on', soundOn);
                });
            }
            function showCheckIn() {
                var overlay = document.getElementById('checkin-overlay');
                if (!overlay) {
                    window.location.href = '../../';
                    return;
                }
                overlay.classList.remove('hidden');
                overlay.setAttribute('aria-hidden', 'false');
            }
            document.getElementById('aed-stop-back')?.addEventListener('click', showCheckIn);
            document.getElementById('checkin-overlay')?.addEventListener('click', function (e) {
                if (!e.target.closest('[data-checkin]')) return;
                /* Check-in answers are discarded — never saved. */
                window.location.href = '../../';
            });
            document.querySelector('[data-emergency-dial]')?.addEventListener('click', function () {
                var choice = window.confirm(
                    'Need support right now?\n\nTap OK to dial 988 (Lifeline).\nTap Cancel to dial 911 instead.'
                );
                window.location.href = 'tel:' + (choice ? '988' : '911');
            });
        })();
    </script>
</body>
</html>
