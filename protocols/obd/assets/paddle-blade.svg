<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" role="img" aria-label="Canoe paddle blade">
  <defs>
    <linearGradient id="cedarGrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5E3C"/>
      <stop offset="35%" stop-color="#A67C52"/>
      <stop offset="68%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#4A2F1A"/>
    </linearGradient>
    <linearGradient id="bladeEdge" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#1D4ED8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="bladeGlow" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Shaft neck -->
    <rect x="54" y="118" width="12" height="72" rx="4" fill="url(#cedarGrain)"/>
  </g>
  <!-- Coast Salishinspired widened blade silhouette -->
  <path
    d="M60 8
       C88 10 104 34 106 58
       C108 82 100 104 60 118
       C20 104 12 82 14 58
       C16 34 32 10 60 8 Z"
    fill="url(#cedarGrain)"
    stroke="#0F172A"
    stroke-width="2.2"
    stroke-linejoin="round"/>
  <!-- Formline inner ovoid -->
  <ellipse cx="60" cy="58" rx="30" ry="38" fill="none" stroke="url(#bladeEdge)" stroke-width="2.4"/>
  <!-- Trigonal relief  traditional split design cue -->
  <path
    d="M60 24 C72 40 74 62 60 78 C46 62 48 40 60 24 Z"
    fill="url(#bladeGlow)"
    stroke="#2563EB"
    stroke-width="1.4"
    stroke-opacity="0.7"/>
  <!-- Gunwale-strike highlight line -->
  <path
    d="M34 92 Q60 104 86 92"
    fill="none"
    stroke="#3B82F6"
    stroke-width="1.6"
    stroke-linecap="round"
    opacity="0.75"/>
</svg>
