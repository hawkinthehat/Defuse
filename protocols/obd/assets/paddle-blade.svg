<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 240" role="img" aria-label="Cedar canoe paddle silhouette">
  <defs>
    <linearGradient id="cedarBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C3D24"/>
      <stop offset="18%" stop-color="#8B5E3C"/>
      <stop offset="42%" stop-color="#A67C52"/>
      <stop offset="58%" stop-color="#7A5234"/>
      <stop offset="82%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#4A2F1A"/>
    </linearGradient>
    <linearGradient id="cedarHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C4A574" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#8B5E3C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3E2818" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shaftGrain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2F1A"/>
      <stop offset="50%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#4A2F1A"/>
    </linearGradient>
    <filter id="paddleShadow" x="-25%" y="-10%" width="150%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1C1208" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#paddleShadow)">
    <!-- Traditional widened cedar blade (vertical, blade leading upward) -->
    <path
      d="M48 6
         C72 8 88 28 90 52
         C92 76 84 98 48 112
         C12 98 4 76 6 52
         C8 28 24 8 48 6 Z"
      fill="url(#cedarBase)"
      stroke="#2A1A0E"
      stroke-width="1.8"
      stroke-linejoin="round"/>
    <path
      d="M48 6
         C72 8 88 28 90 52
         C92 76 84 98 48 112
         C12 98 4 76 6 52
         C8 28 24 8 48 6 Z"
      fill="url(#cedarHighlight)"/>
    <!-- Subtle wood grain on blade -->
    <path d="M22 44 Q48 56 74 44" fill="none" stroke="#5C3D24" stroke-width="0.9" stroke-opacity="0.45"/>
    <path d="M18 68 Q48 78 78 68" fill="none" stroke="#5C3D24" stroke-width="0.7" stroke-opacity="0.35"/>
    <!-- Shaft neck and handle -->
    <rect x="42" y="108" width="12" height="118" rx="5" fill="url(#shaftGrain)"/>
    <rect x="44" y="112" width="3" height="110" rx="1.5" fill="#C4A574" fill-opacity="0.25"/>
    <ellipse cx="48" cy="228" rx="10" ry="5" fill="#4A2F1A"/>
  </g>
</svg>
