<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defuse App</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .card { background: #1e293b; border-radius: 15px; padding: 20px; margin: 10px auto; max-width: 350px; border: 1px solid #2dd4bf; }
        .btn { background: #2dd4bf; color: #0f172a; border: none; padding: 20px; border-radius: 10px; width: 100%; max-width: 300px; font-weight: bold; font-size: 1.1rem; margin: 10px 0; cursor: pointer; }
        .sos { background: #f43f5e; color: white; }
        .hidden { display: none; }
        #timer { font-size: 4rem; color: #2dd4bf; }
    </style>
</head>
<body>

    <div id="home">
        <h1 style="color: #2dd4bf; letter-spacing: 3px;">DEFUSE</h1>
        <p style="opacity: 0.7;">Select a neutralization protocol:</p>
        
        <button class="btn sos" onclick="showScreen('sos')">SOS: BREATHING</button>
        <button class="btn" onclick="showScreen('ice')">ICE RESET ❄️</button>
        <button class="btn" onclick="showScreen('ground')">SENSORY ANCHOR</button>
    </div>

    <div id="sos" class="hidden">
        <h2>Breathe with the pulse</h2>
        <div style="width:100px; height:100px; background:#2dd4bf; border-radius:50%; margin: 40px auto; opacity:0.5;"></div>
        <button class="btn" onclick="showScreen('home')">STABILIZED</button>
    </div>

    <div id="ice" class="hidden">
        <h2>ICE DIVE</h2>
        <p>Apply ice to face for 15 seconds.</p>
        <h1 id="timer">15</h1>
        <button class="btn" onclick="startTimer()">START TIMER</button>
        <button class="btn" onclick="showScreen('home')" style="background:none; color:white;">CANCEL</button>
    </div>

    <div id="ground" class="hidden">
        <h2>5-4-3-2-1</h2>
        <p>Identify 5 things you see.</p>
        <button class="btn" onclick="showScreen('home')">DONE</button>
    </div>

    <script>
        function showScreen(id) {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('sos').classList.add('hidden');
            document.getElementById('ice').classList.add('hidden');
            document.getElementById('ground').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function startTimer() {
            let t = 15;
            const el = document.getElementById('timer');
            const interval = setInterval(() => {
                t--;
                el.innerText = t;
                if(t <= 0) {
                    clearInterval(interval);
                    alert("System Reset Complete.");
                    showScreen('home');
                }
            }, 1000);
        }
    </script>
</body>
</html>
