<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DEFUSE</title>
    <style>
        body { background-color: #0f172a !important; color: white !important; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .btn { display: block; width: 80%; max-width: 300px; margin: 20px auto; padding: 20px; background: #2dd4bf; color: #0f172a; border: none; border-radius: 10px; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        .sos { background: #f43f5e; color: white; }
        .screen { display: none; }
        .active { display: block; }
    </style>
</head>
<body>

    <div id="home" class="screen active">
        <h1 style="color: #2dd4bf;">DEFUSE</h1>
        <button class="btn sos" onclick="show('sos')">SOS: BREATHING</button>
        <button class="btn" onclick="show('ice')">ICE RESET</button>
    </div>

    <div id="sos" class="screen">
        <h2>Breathe...</h2>
        <button class="btn" onclick="show('home')">BACK</button>
    </div>

    <div id="ice" class="screen">
        <h2>Hold Ice for 15s</h2>
        <button class="btn" onclick="show('home')">BACK</button>
    </div>

    <script>
        function show(id) {
            document.getElementById('home').classList.remove('active');
            document.getElementById('sos').classList.remove('active');
            document.getElementById('ice').classList.remove('active');
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
