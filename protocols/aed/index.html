<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ʔuʔəy̓ — Autonomic Exposure Desensitization</title>
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-title" content="ʔuʔəy̓">
    <link rel="stylesheet" href="../../style.css">
    <style>
        :root {
            --aed-bg: #050608;
            --aed-calm-blue: #4a8fb8;
            --aed-exit-border: rgba(74, 143, 184, 0.55);
            --emergency-footer-height: 80px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--aed-bg) !important;
            color: rgba(140, 156, 170, 0.38);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            -webkit-tap-highlight-color: transparent;
            display: block !important;
            justify-content: unset !important;
        }

        .aed-page {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: var(--aed-bg);
        }

        .aed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 11998;
            margin: 0;
            padding: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 12px)) 0 max(12px, env(safe-area-inset-left, 12px));
            background: transparent;
            pointer-events: none;
        }

        .aed-anchor,
        .protocol-word-header {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.35;
            text-align: center;
            color: #cbd5e1;
        }

        .aed-exit {
            position: fixed;
            top: calc(env(safe-area-inset-top, 12px) + 12px);
            right: max(12px, env(safe-area-inset-right, 12px));
            z-index: 12000;
            border: 1.5px solid var(--aed-exit-border);
            background: rgba(10, 13, 18, 0.92);
            color: var(--aed-calm-blue);
            padding: 11px 14px;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-decoration: none;
            font-family: inherit;
            border-radius: 4px;
            touch-action: manipulation;
        }

        .aed-exit:focus-visible {
            outline: 2px solid var(--aed-calm-blue);
            outline-offset: 2px;
        }

        .aed-shell {
            flex: 1;
            position: relative;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            background: var(--aed-bg);
            transition: filter 0.4s linear;
        }

        #instruction-overlay {
            position: fixed;
            inset: 0;
            z-index: 11000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0 max(1.5rem, env(safe-area-inset-left, 0px)) 0 max(1.5rem, env(safe-area-inset-right, 0px));
            background: rgba(0, 0, 0, 0.88);
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            font-weight: 600;
            line-height: 1.35;
            letter-spacing: 0.03em;
            text-align: center;
            color: #e2e8f0;
            pointer-events: none;
            opacity: 1;
            transition: opacity 500ms ease;
        }

        #instruction-overlay.is-fading {
            opacity: 0;
        }

        #aed-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: default;
            background: var(--aed-bg);
        }
    </style>
</head>
<body>
    <div class="aed-page" id="aed-page">
        <header class="aed-header" aria-hidden="true">
            <p class="protocol-word-header aed-anchor">ʔuʔəy̓ (oo-uh-ee)</p>
        </header>

        <a class="aed-exit" href="../../" title="Return to dashboard">EXIT</a>

        <main class="aed-shell" id="aed-shell" aria-label="Attention bias modification canvas">
            <canvas id="aed-canvas" aria-hidden="true"></canvas>
        </main>

        <div id="instruction-overlay" role="status" aria-live="polite">Focus on the glowing ovoids.</div>

        <footer class="emergency-exit-bar emergency-exit-bar--global" aria-label="Crisis emergency resources — always available">
            <button type="button" class="emergency-exit-link" data-emergency-dial>Emergency: dial 988 / 911</button>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        document.querySelector('[data-emergency-dial]')?.addEventListener('click', function () {
            var choice = window.confirm(
                'EMERGENCY CRISIS SUPPORT\n\nTap OK to dial 988 (Suicide & Crisis Lifeline).\nTap Cancel to dial 911 instead.'
            );
            window.location.href = 'tel:' + (choice ? '988' : '911');
        });
    </script>
</body>
</html>
