<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ʔuʔəy̓ — Autonomic Exposure Desensitization</title>
    <meta name="theme-color" content="#050608">
    <meta name="apple-mobile-web-app-title" content="ʔuʔəy̓">
    <style>
        :root {
            --aed-bg: #050608;
            --aed-bg-soft: #0a0d12;
            --aed-calm-blue: #4a8fb8;
            --aed-calm-green: #5a9a7a;
            --aed-text: rgba(180, 196, 210, 0.72);
            --aed-exit-border: rgba(74, 143, 184, 0.55);
            --emergency-footer-height: 80px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--aed-bg);
            color: var(--aed-text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        .aed-page {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding-bottom: 80px;
            background: var(--aed-bg);
        }

        .aed-exit {
            position: fixed;
            top: calc(env(safe-area-inset-top, 12px) + 12px);
            right: max(12px, env(safe-area-inset-right, 12px));
            z-index: 12000;
            border: 1.5px solid var(--aed-exit-border);
            background: rgba(10, 13, 18, 0.92);
            color: var(--aed-calm-blue);
            padding: 11px 14px;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-decoration: none;
            font-family: inherit;
            border-radius: 4px;
            touch-action: manipulation;
        }

        .aed-exit:focus-visible {
            outline: 2px solid var(--aed-calm-blue);
            outline-offset: 2px;
        }

        .aed-shell {
            flex: 1;
            position: relative;
            width: 100%;
            min-height: 0;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: 80px;
            overflow: hidden;
            transition: filter 0.4s linear;
        }

        .aed-intro-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0 max(1.5rem, env(safe-area-inset-left, 0px)) 0 max(1.5rem, env(safe-area-inset-right, 0px));
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            font-weight: 600;
            line-height: 1.35;
            letter-spacing: 0.03em;
            text-align: center;
            color: rgba(200, 228, 218, 0.94);
            text-shadow: 0 0 32px rgba(72, 196, 212, 0.35);
            pointer-events: none;
            opacity: 1;
            transition: opacity 500ms ease;
        }

        .aed-intro-overlay.is-fading {
            opacity: 0;
        }

        #aed-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: default;
        }

        .aed-emergency-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 15000;
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
            background: rgba(8, 8, 10, 0.97);
            border-top: 2px solid rgba(220, 38, 38, 0.55);
            box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.45);
            pointer-events: auto;
        }

        .aed-emergency-link {
            display: block;
            width: 100%;
            max-width: 26rem;
            margin: 0 auto;
            padding: 12px 14px;
            border: 2.5px solid #dc2626;
            border-radius: 8px;
            background: #1a0a0a;
            color: #fecaca;
            font-size: clamp(0.72rem, 3vw, 0.82rem);
            font-weight: 900;
            letter-spacing: 0.06em;
            text-align: center;
            cursor: pointer;
            font-family: inherit;
            touch-action: manipulation;
        }

        .aed-emergency-link:hover,
        .aed-emergency-link:focus-visible {
            background: #2a1010;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
        }
    </style>
</head>
<body>
    <div class="aed-page" id="aed-page">
        <a class="aed-exit" href="../../" title="Return to dashboard">EXIT</a>

        <main class="aed-shell" id="aed-shell" aria-label="Attention bias modification canvas">
            <p class="aed-intro-overlay" id="aed-intro-overlay" role="status" aria-live="polite">Focus on the glowing ovoids.</p>
            <canvas id="aed-canvas" aria-hidden="true"></canvas>
        </main>

        <footer class="aed-emergency-bar" aria-label="Crisis emergency resources — always available">
            <button type="button" class="aed-emergency-link" data-emergency-dial>⚠️ EMERGENCY: DIAL 988 / 911</button>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        document.querySelector('[data-emergency-dial]')?.addEventListener('click', function () {
            var choice = window.confirm(
                'EMERGENCY CRISIS SUPPORT\n\nTap OK to dial 988 (Suicide & Crisis Lifeline).\nTap Cancel to dial 911 instead.'
            );
            window.location.href = 'tel:' + (choice ? '988' : '911');
        });
    </script>
</body>
</html>
