<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">DeFuse logo</title>
  <desc id="desc">Stylized DeFuse momentum system logo with lightning bolt and concentric rings.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#263447"/>
      <stop offset="58%" stop-color="#182336"/>
      <stop offset="100%" stop-color="#101827"/>
    </radialGradient>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)"/>

  <g opacity="0.35" stroke="#8b99b3" stroke-width="8" fill="none">
    <circle cx="450" cy="400" r="220"/>
    <circle cx="450" cy="400" r="200"/>
    <circle cx="450" cy="400" r="180"/>
    <circle cx="450" cy="400" r="160"/>
    <circle cx="450" cy="400" r="140"/>
  </g>

  <g fill="#6ee7ff" filter="url(#glow-cyan)">
    <path d="M95 430 370 405 435 335 405 430 805 425 500 445 425 545 452 445 95 430z"/>
  </g>
  <g fill="#f8fafc">
    <path d="M445 336 585 230 635 268 500 400z"/>
    <path d="M268 585 405 442 450 445 325 632z"/>
  </g>

  <g transform="translate(450 565)">
    <circle r="48" fill="none" stroke="#6ee7ff" stroke-width="8" filter="url(#soft-glow)"/>
    <ellipse rx="30" ry="18" fill="none" stroke="#6ee7ff" stroke-width="5" transform="rotate(-28)"/>
    <ellipse rx="30" ry="18" fill="none" stroke="#6ee7ff" stroke-width="5" transform="rotate(28)"/>
    <circle r="7" fill="#6ee7ff"/>
  </g>

  <g text-anchor="middle" font-family="Inter, SF Pro Display, Arial, sans-serif">
    <text x="450" y="770" font-size="118" font-weight="800" fill="#f8fafc" letter-spacing="1">DeFuse</text>
    <line x1="180" y1="810" x2="720" y2="810" stroke="#7f8ba3" stroke-width="3" opacity="0.6"/>
    <text x="450" y="870" font-size="62" font-weight="500" fill="#9aa5b7" letter-spacing="3">A MOMENTUM SYSTEM</text>
  </g>
</svg>
