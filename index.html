<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEFUSE v3.2 | OKN Restored</title>
    <style>
        :root { --bg: #000; --teal: #00d2d3; --white: #fff; --blue: #70a1ff; --alert: #ff0000; }
        body { background: var(--bg); color: var(--teal); margin: 0; font-family: sans-serif; overflow: hidden; }
        #dashboard { display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 40px 20px; }
        
        .protocol-card { background: #000; border: 1.5px solid var(--teal); padding: 30px; width: 85%; max-width: 400px; text-align: center; cursor: pointer; border-radius: 4px; }
        .protocol-card.warning { border-color: var(--alert); box-shadow: 0 0 15px rgba(255, 0, 0, 0.2); }
        .callsign { font-size: 2.8rem; font-weight: 900; color: var(--white); margin: 0; text-shadow: 0 0 15px var(--teal); letter-spacing: 8px; }
        .protocol-card.warning .callsign { text-shadow: 0 0 20px var(--alert); }
        .purpose { color: var(--blue); font-family: monospace; font-size: 0.65rem; border-top: 1px solid #333; margin-top: 15px; padding-top: 10px; text-transform: uppercase; }

        #viewport { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; overflow: hidden; }
        
        /* THE OKN TUNNEL (CAS) */
        .okn-shape { 
            position: absolute; 
            border: 2px solid var(--teal); 
            opacity: 0; 
            animation: okn-pull 3s infinite linear; 
        }
        @keyframes okn-pull {
            0% { width: 120vw; height: 120vw; opacity: 0; transform: rotate(0deg); }
            15% { opacity: 0.5; }
            100% { width: 0px; height: 0px; opacity: 0; transform: rotate(90deg); }
        }

        /* EXPLODING WORD (CCD) */
        .exploding-word { font-size: 3.5rem; font-weight: 900; color: white; animation: shatter 0.8s forwards; }
        @keyframes shatter {
            0% { transform: scale(0.5); opacity: 0; }
            20% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(5); filter: blur(40px); opacity: 0; letter-spacing: 80px; }
        }

        /* EMERGENCY STROBE (KCB) */
        .strobe { width: 100%; height: 100%; animation: alert-flash 0.15s infinite; }
        @keyframes alert-flash { 0% { background: #000; } 50% { background: #440000; } 100% { background: #000; } }

        #feather { width: 30px; height: 30px; background: var(--teal); border-radius: 50%; position: absolute; box-shadow: 0 0 20px var(--teal); animation: sweep 2s infinite steps(15) alternate; }
        @keyframes sweep { from { left: 10%; } to { left: 90%; } }
        .exit-btn { position: fixed; top: 20px; right: 20px; border: 1px solid #fff; color: #fff; padding: 10px; z-index: 2000; font-size: 10px; }
    </style>
</head>
<body>

    <div id="dashboard">
        <div class="protocol-card" onclick="runCPI()"><h2 class="callsign">CPI</h2><p class="purpose">BREAK AUTOPILOT</p></div>
        <div class="protocol-card" onclick="runOBD()"><h2 class="callsign">OBD</h2><p class="purpose">LATERAL REPATTERNING</p></div>
        <div class="protocol-card" onclick="runCCD()"><h2 class="callsign">CCD</h2><p class="purpose">EXPLODE THOUGHT</p></div>
        <div class="protocol-card" onclick="runCAS()"><h2 class="callsign">CAS</h2><p class="purpose">OKN GROUNDING</p></div>
        <div class="protocol-card warning" onclick="runKCB()"><h2 class="callsign">KCB</h2><p class="purpose">EMERGENCY RESET</p></div>
    </div>

    <div id="viewport">
        <div class="exit-btn" onclick="document.getElementById('viewport').style.display='none'; document.getElementById('content').innerHTML='';">EXIT</div>
        <div id="content" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;"></div>
    </div>

    <script>
        const vp = document.getElementById('viewport');
        const ct = document.getElementById('content');

        function runCPI() {
            vp.style.display = 'flex';
            ct.innerHTML = Math.random() > 0.5 ? '<h2 style="color:white">REVERSE: DEFUSE</h2>' : '<h2 style="color:white">FIND 0: 1111011</h2>';
        }

        function runOBD() { vp.style.display = 'flex'; ct.innerHTML = '<div id="feather"></div>'; }

        function runCCD() {
            vp.style.display = 'flex';
            ct.innerHTML = '<h1 class="exploding-word">ANXIETY</h1>';
            setTimeout(() => { vp.style.display='none'; }, 1000);
        }

        function runCAS() {
            vp.style.display = 'flex';
            // Dense shape stream for OKN induction
            let html = '';
            for(let i=0; i<8; i++) {
                const type = i % 3 === 0 ? '50%' : (i % 3 === 1 ? '4px' : 'clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%)');
                html += `<div class="okn-shape" style="animation-delay:${i*0.4}s; border-radius:${type.includes('clip') ? '0' : type}; ${type.includes('clip') ? type : ''}"></div>`;
            }
            ct.innerHTML = html;
        }

        function runKCB() {
            vp.style.display = 'flex';
            ct.innerHTML = '<div class="strobe"></div><h1 style="position:absolute;color:white">SYSTEM RESET</h1>';
        }
    </script>
</body>
</html>
