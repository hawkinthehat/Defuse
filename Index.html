<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEFUSE | Neutralize</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --teal: #2dd4bf;
            --gold: #f59e0b;
            --red: #f43f5e;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--bg) !important; 
            color: var(--text); 
            font-family: -apple-system, system-ui, sans-serif; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; text-align: center; }
        .active { display: flex; }

        h1 { color: var(--teal); letter-spacing: 4px; font-weight: 900; margin-top: 40px; }
        p { opacity: 0.7; line-height: 1.5; }

        .btn { 
            background: var(--card); 
            border: 2px solid var(--teal); 
            color: var(--teal); 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            margin: 10px 0; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-sos { background: var(--red); border: none; color: white; font-size: 1.3rem; margin-bottom: 20px; }

        #timer { font-size: 5rem; color: var(--teal); font-weight: 900; margin: 20px 0; }

        /* SIMPLE PULSE FOR SOS */
        .pulse {
            width: 120px; height: 120px;
            background: var(--teal);
            border-radius: 50%;
            margin: 40px auto;
            opacity: 0.3;
            animation: pulse-anim 8s infinite ease-in-out;
        }
        @keyframes pulse-anim {
            0%, 100% { transform: scale(0.8); }
            50% { transform: scale(1.3); }
        }

        nav { position: fixed; bottom: 20px; display: flex; gap: 20px; }
        .nav-btn { background: none; border: none; color: var(--text); opacity: 0.5; font-size: 0.8rem; cursor: pointer; }

        #visual {
            width: 100%;
            height: 180px;
            margin: 20px 0;
            border-radius: 16px;
            border: 1px solid rgba(94, 234, 212, 0.2);
            background: radial-gradient(circle at center, #064e3b 0%, #020617 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .anchor {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(45, 212, 191, 0.35);
            box-shadow: 0 0 24px rgba(45, 212, 191, 0.35);
            transition: background 250ms ease, box-shadow 250ms ease, transform 250ms ease;
            animation: anchor-breathe 4s ease-in-out infinite;
        }

        .visual-active .anchor {
            background: #5eead4;
            box-shadow: 0 0 40px #2dd4bf;
            transform: scale(1.08);
        }

        @keyframes anchor-breathe {
            0%, 100% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="home" class="screen active">
        <h1>DEFUSE</h1>
        <p>Tactical Neutralization Protocol</p>
        <div style="margin-top: 30px; width: 100%;">
            <button class="btn btn-sos" onclick="nav('sos')">SOS: BREATHING</button>
            <button class="btn" onclick="nav('ice')">BIOLOGICAL RESET ❄️</button>
            <button class="btn" onclick="nav('ground')">SENSORY ANCHOR</button>
            <button class="btn" style="background: var(--gold); color: var(--bg); border-color: var(--gold);" onclick="nav('activate')">⚡ GET MOVING (MICRO-WIN)</button>
        </div>
    </div>

    <div id="sos" class="screen">
        <h1>BREATHE</h1>
        <div class="pulse"></div>
        <p id="b-text">Sync your breath with the circle.</p>
        <button class="btn" onclick="nav('home')">STABILIZED</button>
    </div>

    <div id="ice" class="screen">
        <h1>RESET</h1>
        <p>Hold ice to your face to force a heart rate drop.</p>
        <div id="timer">15</div>
        <button class="btn" id="t-start" onclick="runTimer()">START OVERRIDE</button>
        <button class="btn" onclick="nav('home')" style="border:none; opacity:0.5;">CANCEL</button>
    </div>

    <div id="ground" class="screen">
        <h1>ANCHOR</h1>
        <p id="g-prompt">Identify 5 things you can SEE.</p>
        <div id="visual" aria-hidden="true">
            <div class="anchor"></div>
        </div>
        <h1 id="g-count" style="font-size: 4rem;">5</h1>
        <button class="btn" onclick="nextAnchor()">NEXT</button>
    </div>

    <div id="activate" class="screen">
        <h2 style="color: var(--gold); letter-spacing: 2px;">MOMENTUM: ACTIVATE</h2>
        <p style="opacity: 0.6; font-size: 0.8rem;">ONE TINY TASK. 60 SECONDS.</p>
        <div id="task-display" style="background: var(--card); border: 2px solid var(--gold); padding: 30px; border-radius: 20px; width: 100%; font-size: 1.6rem; font-weight: 900; margin: 20px 0; color: var(--gold);">---</div>
        <div id="act-timer" style="font-size: 4rem; font-weight: 900; margin-bottom: 20px;">60</div>
        <button id="act-btn" class="btn" style="background: var(--gold); color: var(--bg); border-color: var(--gold);" onclick="startActTimer()">START SPRINT</button>
        <button class="btn" style="border:none; opacity:0.5;" onclick="exitAll()">CANCEL</button>
    </div>

    <div id="success" class="screen">
        <h1 style="color: var(--gold);">COMPLETE</h1>
        <p>Micro-win secured. Momentum restored.</p>
        <button class="btn" onclick="nav('home')">BACK HOME</button>
    </div>

    <nav>
        <button class="nav-btn" onclick="nav('home')">HOME</button>
        <button class="nav-btn" onclick="alert('Defuse Pro: Log triggers to your Vault ($4.99/mo)')">VAULT 🔒</button>
    </nav>

    <script>
        let breathingInterval = null;
        let audioCtx = null;
        let binauralGain = null;
        let spiritNoise = null;
        let spiritMotionInterval = null;

        function ensureAudioGraph() {
            if (audioCtx) return true;
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return false;
            audioCtx = new AudioContextClass();
            binauralGain = audioCtx.createGain();
            binauralGain.gain.value = 0.22;
            binauralGain.connect(audioCtx.destination);
            return true;
        }

        function setPannerPosition(panner, x, y, z) {
            if (panner.positionX && panner.positionY && panner.positionZ) {
                panner.positionX.setValueAtTime(x, audioCtx.currentTime);
                panner.positionY.setValueAtTime(y, audioCtx.currentTime);
                panner.positionZ.setValueAtTime(z, audioCtx.currentTime);
            } else {
                panner.setPosition(x, y, z);
            }
        }

        // Spirit Landscape Audio Assets (synthesized web audio for zero-load time)
        function playSpiritLandscape(type = 'forest') {
            if (!ensureAudioGraph()) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stopSpiritLandscape();

            const filter = audioCtx.createBiquadFilter();
            const noise = audioCtx.createBufferSource();
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            // Create pink-ish noise base for a deep nature bed.
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            noise.buffer = buffer;
            noise.loop = true;

            // The "Spirit" filter profile.
            filter.type = 'lowpass';
            const typeFrequency = {
                forest: 400,
                cave: 320,
                river: 520
            };
            filter.frequency.value = typeFrequency[type] || 400;

            // Spatial panner (bilateral movement).
            const panner = audioCtx.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'inverse';
            panner.refDistance = 1;
            panner.maxDistance = 12;

            noise.connect(filter);
            filter.connect(panner);
            panner.connect(binauralGain);

            // Animate the sound moving in a 3D arc around the head.
            let angle = 0;
            spiritMotionInterval = setInterval(() => {
                angle += 0.05;
                setPannerPosition(panner, Math.sin(angle) * 5, 0, Math.cos(angle) * 2);
            }, 50);

            noise.start();
            spiritNoise = noise;
        }

        function stopSpiritLandscape() {
            if (spiritMotionInterval) {
                clearInterval(spiritMotionInterval);
                spiritMotionInterval = null;
            }
            if (spiritNoise) {
                try {
                    spiritNoise.stop();
                } catch (e) {
                    // Ignore stop errors when source is already ended.
                }
                spiritNoise.disconnect();
                spiritNoise = null;
            }
        }

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.body.classList.toggle('visual-active', id === 'ground');

            if (id === 'sos') startBreathing();
            else if (breathingInterval) {
                clearInterval(breathingInterval);
                breathingInterval = null;
            }

            if (id === 'ground') playSpiritLandscape('forest');
            else stopSpiritLandscape();

            if (id === 'activate') {
                nextActTask();
                resetActScreen();
            } else {
                clearInterval(actInt);
            }
        }

        // SOS LOGIC
        function startBreathing() {
            const txt = document.getElementById('b-text');
            if (breathingInterval) clearInterval(breathingInterval);
            breathingInterval = setInterval(() => {
                let s = Math.floor(Date.now() / 1000) % 8;
                if (s < 4) txt.innerText = "INHALING...";
                else txt.innerText = "EXHALING...";
            }, 1000);
        }

        // TIMER LOGIC
        function runTimer() {
            let t = 15;
            const el = document.getElementById('timer');
            const btn = document.getElementById('t-start');
            btn.disabled = true;
            const int = setInterval(() => {
                t--; el.innerText = t;
                if(t <= 0) { clearInterval(int); el.innerText = "DONE"; btn.disabled = false; }
            }, 1000);
        }

        // GROUNDING LOGIC
        let step = 5;
        const prompts = ["SEE", "TOUCH", "HEAR", "SMELL", "TASTE"];
        function nextAnchor() {
            step--;
            if(step < 1) { step = 5; nav('home'); return; }
            document.getElementById('g-prompt').innerText = "Identify " + step + " things you can " + prompts[5-step] + ".";
            document.getElementById('g-count').innerText = step;
        }

        // ACTIVATE LOGIC
        const activeTasks = [
            "Straighten one item in this room.",
            "Drink exactly 3 sips of water.",
            "Stand up and reach for the ceiling.",
            "Put one piece of trash in the bin.",
            "Find a cold surface and touch it.",
            "Adjust your posture right now.",
            "Name 3 things you can see.",
            "Roll your shoulders 3 times."
        ];

        let actInt;
        function startActTimer() {
            let t = 60;
            const display = document.getElementById('act-timer');
            const btn = document.getElementById('act-btn');
            btn.style.display = 'none';

            display.innerText = t;
            clearInterval(actInt);
            actInt = setInterval(() => {
                t--;
                display.innerText = t;
                if(t <= 0) {
                    clearInterval(actInt);
                    triggerSuccess();
                }
            }, 1000);
        }

        function nextActTask() {
            const task = activeTasks[Math.floor(Math.random() * activeTasks.length)];
            document.getElementById('task-display').innerText = task;
        }

        function resetActScreen() {
            clearInterval(actInt);
            document.getElementById('act-timer').innerText = "60";
            document.getElementById('act-btn').style.display = 'block';
        }

        function triggerSuccess() {
            nav('success');
        }

        function exitAll() {
            resetActScreen();
            nav('home');
        }
    </script>
</body>
</html>
