<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEFUSE v3.2</title>
    <style>
        :root { --bg: #05070a; --teal: #00d2d3; --white: #ffffff; --blue: #70a1ff; }
        body { background: var(--bg); color: var(--teal); margin: 0; font-family: sans-serif; overflow: hidden; }
        
        #dashboard { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 60px 20px; }
        
        .protocol-card { 
            background: #000; border: 1.5px solid var(--teal); padding: 30px; 
            width: 85%; max-width: 400px; text-align: center; cursor: pointer;
        }

        .callsign { font-size: 3rem; font-weight: 900; color: var(--white); margin: 0; text-shadow: 0 0 15px var(--teal); }
        .term { font-size: 0.6rem; color: rgba(255,255,255,0.6); letter-spacing: 2px; }
        .purpose { color: var(--blue); font-family: monospace; font-size: 0.7rem; border-top: 1px solid #333; margin-top: 15px; padding-top: 10px; }

        /* SESSION VIEWPORT */
        #viewport { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: #000; display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 1000; 
        }

        #feather { 
            width: 30px; height: 30px; background: var(--teal); border-radius: 50%; 
            position: absolute; box-shadow: 0 0 20px var(--teal); 
            animation: sweep 2s infinite steps(15) alternate;
        }

        @keyframes sweep { from { left: 10%; } to { left: 90%; } }
        
        .exit-btn { position: fixed; top: 20px; right: 20px; border: 1px solid #fff; color: #fff; padding: 10px; z-index: 2000; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body>

    <div id="dashboard">
        <div class="protocol-card" onclick="document.getElementById('viewport').style.display='flex'; document.getElementById('content').innerHTML='<h1 style=\'color:white\'>REVERSE: STABILIZE</h1>';">
            <p class="term">COGNITIVE PATTERN INTERRUPT</p>
            <h2 class="callsign">CPI</h2>
            <p class="purpose">USE THIS TO: BREAK AUTOPILOT</p>
        </div>

        <div class="protocol-card" onclick="document.getElementById('viewport').style.display='flex'; document.getElementById('content').innerHTML='<div id=\'feather\'></div>';">
            <p class="term">OCULAR BILATERAL DESENSITIZATION</p>
            <h2 class="callsign">OBD</h2>
            <p class="purpose">USE THIS TO: UNSTICK LOOPS</p>
        </div>
    </div>

    <div id="viewport">
        <div class="exit-btn" onclick="document.getElementById('viewport').style.display='none';">EXIT</div>
        <div id="content"></div>
    </div>

    <div class="scanlines"></div>

</body>
</html>
