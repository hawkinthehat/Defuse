<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>gʷədiʔ — Micro-Interoceptive Focus</title>
    <meta name="theme-color" content="#040506">
    <meta name="apple-mobile-web-app-title" content="gʷədiʔ">
    <link rel="stylesheet" href="../../style.css">
    <style>
        :root {
            --mif-bg: #040506;
            --mif-bg-soft: #080a0c;
            --mif-path: rgba(92, 148, 132, 0.55);
            --mif-path-glow: rgba(72, 128, 112, 0.28);
            --mif-pulse: rgba(110, 168, 148, 0.72);
            --mif-text: rgba(160, 178, 168, 0.68);
            --mif-exit-border: rgba(92, 148, 132, 0.5);
            --emergency-footer-height: 80px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--mif-bg);
            color: var(--mif-text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        .mif-page {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding-bottom: 80px;
            background: var(--mif-bg);
        }

        .mif-exit {
            position: fixed;
            top: calc(env(safe-area-inset-top, 12px) + 12px);
            right: max(12px, env(safe-area-inset-right, 12px));
            z-index: 12000;
            border: 1.5px solid var(--mif-exit-border);
            background: rgba(8, 10, 12, 0.92);
            color: rgba(110, 168, 148, 0.92);
            padding: 11px 14px;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-decoration: none;
            font-family: inherit;
            border-radius: 4px;
            touch-action: manipulation;
        }

        .mif-exit:focus-visible {
            outline: 2px solid rgba(110, 168, 148, 0.85);
            outline-offset: 2px;
        }

        .mif-inst {
            position: fixed;
            top: calc(env(safe-area-inset-top, 12px) + 14px);
            left: max(16px, env(safe-area-inset-left, 0px));
            right: calc(max(20px, env(safe-area-inset-right, 0px)) + 5.75rem);
            margin: 0;
            z-index: 11999;
            pointer-events: none;
        }

        .mif-status {
            position: fixed;
            top: calc(env(safe-area-inset-top, 12px) + 2.75rem);
            left: max(16px, env(safe-area-inset-left, 0px));
            right: calc(max(20px, env(safe-area-inset-right, 0px)) + 5.75rem);
            margin: 0;
            z-index: 11998;
            font-size: clamp(0.58rem, 2.2vw, 0.68rem);
            line-height: 1.35;
            letter-spacing: 0.06em;
            font-weight: 600;
            text-align: center;
            color: rgba(148, 163, 184, 0.72);
            pointer-events: none;
        }

        .mif-shell {
            flex: 1;
            position: relative;
            width: 100%;
            min-height: 0;
            padding-top: calc(env(safe-area-inset-top, 0px) + 3.25rem);
            padding-bottom: 80px;
            overflow: hidden;
        }

        #mif-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            display: block;
            z-index: 1;
            touch-action: none;
            cursor: default;
            -webkit-user-select: none;
            user-select: none;
        }

        .mif-onboarding-host {
            position: fixed;
            inset: 0;
            z-index: 12500;
            pointer-events: none;
        }

        .mif-onboarding-host .protocol-onboarding-overlay {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="mif-page" id="mif-page">
        <button type="button" class="mif-exit stop-back-btn" id="mif-stop-back" title="Stop and go back">STOP &amp; BACK</button>
        <button type="button" id="gameplay-audio-toggle" class="gameplay-audio-toggle gameplay-theta-toggle" aria-pressed="false" aria-label="Sound off. Tap to turn on." title="Toggle optional sound">
            <span class="gameplay-theta-toggle-prefix" aria-hidden="true">♪</span>
            <span class="gameplay-theta-toggle-label">Sound</span>
            <span class="gameplay-theta-toggle-state" aria-hidden="true">OFF</span>
        </button>
        <p class="mif-inst protocol-header" id="mif-inst" role="status">Quiet moment</p>
        <p class="mif-status" id="mif-status" role="status">Read instructions — then start</p>

        <main class="mif-shell" id="mif-shell" aria-label="Quiet touch tracing canvas">
            <canvas id="mif-canvas" aria-hidden="true"></canvas>
        </main>

        <div id="mif-onboarding-host" class="mif-onboarding-host"></div>

        <div id="checkin-overlay" class="checkin-overlay hidden" aria-hidden="true">
            <section class="checkin-card" role="dialog" aria-modal="true" aria-labelledby="checkin-title">
                <h2 id="checkin-title" class="checkin-title">Did that help?</h2>
                <p class="checkin-sub">Optional — nothing is saved or shared.</p>
                <div class="checkin-choices">
                    <button type="button" class="checkin-choice" data-checkin="better">Feeling a bit better</button>
                    <button type="button" class="checkin-choice" data-checkin="switch">Try something else</button>
                    <button type="button" class="checkin-choice" data-checkin="break">I need a break</button>
                </div>
            </section>
        </div>

        <footer class="emergency-exit-bar emergency-exit-bar--global" aria-label="Crisis support — always available">
            <p class="crisis-footer-text">Need immediate support? Call or text 988 or 911. This app cannot send emergency help.</p>
            <button type="button" class="emergency-exit-link" data-emergency-dial>Call or text 988 / 911</button>
        </footer>
    </div>

    <script src="../../safety-control.js"></script>
    <script src="../onboarding/protocol-onboarding.js"></script>
    <script src="script.js"></script>
    <script>
        (function () {
            var soundOn = false;
            var toggle = document.getElementById('gameplay-audio-toggle');
            if (toggle) {
                toggle.addEventListener('click', function () {
                    soundOn = !soundOn;
                    toggle.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
                    toggle.setAttribute('aria-label', soundOn ? 'Sound on. Tap to turn off.' : 'Sound off. Tap to turn on.');
                    var state = toggle.querySelector('.gameplay-theta-toggle-state');
                    if (state) state.textContent = soundOn ? 'ON' : 'OFF';
                    toggle.classList.toggle('gameplay-theta-toggle--on', soundOn);
                });
            }
            function showCheckIn() {
                var overlay = document.getElementById('checkin-overlay');
                if (!overlay) {
                    window.location.href = '../../';
                    return;
                }
                overlay.classList.remove('hidden');
                overlay.setAttribute('aria-hidden', 'false');
            }
            document.getElementById('mif-stop-back')?.addEventListener('click', showCheckIn);
            document.getElementById('checkin-overlay')?.addEventListener('click', function (e) {
                if (!e.target.closest('[data-checkin]')) return;
                /* Check-in answers are discarded — never saved. */
                window.location.href = '../../';
            });
            document.querySelector('[data-emergency-dial]')?.addEventListener('click', function () {
                var choice = window.confirm(
                    'Need support right now?\n\nTap OK to dial 988 (Lifeline).\nTap Cancel to dial 911 instead.'
                );
                window.location.href = 'tel:' + (choice ? '988' : '911');
            });

            var host = document.getElementById('mif-onboarding-host');
            if (host && window.ProtocolOnboarding && typeof window.ProtocolOnboarding.mount === 'function') {
                window.ProtocolOnboarding.mount(host, {
                    protocolKey: 'mif',
                    onStart: function () {
                        if (typeof window.engageMIFSession === 'function') {
                            window.engageMIFSession();
                        }
                    },
                    replace: true
                });
            }
        })();
    </script>
</body>
</html>
